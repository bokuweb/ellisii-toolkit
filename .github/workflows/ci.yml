name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # ort 2.x downloads prebuilt onnxruntime binaries; keep them cacheable.
  ORT_STRATEGY: download

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # llama-cpp-2 builds llama.cpp from source; cmake comes with the
          # runner already. libssl-dev / pkg-config for openssl-sys.
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libssl-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-clippy
          cache-on-failure: true

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libssl-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-test
          cache-on-failure: true

      # Tests requiring external assets (ONNX / gguf / OCR weights) are
      # gated with `#[ignore]` per CLAUDE.md and not run by default. To
      # exercise them locally, add `-- --ignored`.
      - run: cargo test --workspace --all-features --no-fail-fast
