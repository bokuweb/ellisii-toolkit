name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ort 2.x downloads prebuilt onnxruntime binaries; keep them cacheable.
  ORT_STRATEGY: download
  # We intentionally do *not* set `RUSTFLAGS: -D warnings` here. The
  # clippy step enforces `-- -D warnings` explicitly; the test step
  # should compile tests even when their bodies have minor unused-import
  # style warnings (they're caught locally and during clippy on the
  # libs / bins). A global RUSTFLAGS would make every `cargo` invocation
  # strict, including downstream dep compilations, which causes friction
  # for no real safety benefit.

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    # Apple Silicon only. `parser-audio` pulls `whisper-rs-sys` which
    # forces `GGML_METAL=ON` and won't build on Linux (the build script
    # has no escape hatch and the Apple `Foundation.framework` is
    # required). Until we have a story for Linux audio, restrict this
    # job to macOS where the whole stack actually works.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-clippy
          cache-on-failure: true
      # Library and binary targets only. Tests / examples / benches have
      # different style conventions (looser data shapes, scripted
      # workflows) and are best policed by `cargo test` compiling them.
      - run: cargo clippy --workspace --lib --bins --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-test
          cache-on-failure: true
      # Tests requiring external assets (ONNX / gguf / OCR weights) are
      # gated with `#[ignore]` per CLAUDE.md and not run by default. To
      # exercise them locally, add `-- --ignored`.
      - run: cargo test --workspace --all-features --no-fail-fast
