# Builds the CLiteRTLM C shared library from google-ai-edge/LiteRT-LM source
# for linux-x86_64 / windows-x86_64 / macos-universal and publishes them as
# assets on a GitHub Release, so that `ellisii-llm-litert`'s build.rs can
# auto-download a host prebuilt (LITERT_LM_PREBUILT=1) instead of every dev
# building the native lib from source.
#
# Google only ships an official *macOS xcframework*; for every other platform
# the upstream repo builds the `litert_lm_main` CLI, not a shared library. So
# we add our own `cc_shared_library` overlay that wraps `//c:engine` (whose C
# ABI functions are already annotated `LITERT_LM_C_API_EXPORT`) and link it as
# one self-contained shared object per platform.
#
# Trigger manually (workflow_dispatch) or by pushing a `litert-prebuilt-v*`
# tag. It never runs on normal pushes/PRs.
#
# NOTE: the per-platform Bazel build is heavy and unproven in CI; expect this
# to need iteration (toolchain/config/LFS/disk). The asset names and the
# install_name/SONAME/DLL names below MUST stay in sync with the resolution
# table in crates/llm-litert/build.rs.

name: litert-prebuilt

on:
  workflow_dispatch:
    inputs:
      litert_lm_ref:
        description: "google-ai-edge/LiteRT-LM git ref (tag/commit) to build"
        default: "v0.12.0"
        required: true
      release_tag:
        description: "Release tag to publish the assets under"
        default: "litert-prebuilt-v0.12.0"
        required: true
  push:
    tags:
      - "litert-prebuilt-v*"

permissions:
  contents: write

env:
  LITERT_LM_REF: ${{ github.event.inputs.litert_lm_ref || 'v0.12.0' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/windows: build the C shared lib from source via Bazel.
          - name: linux-x86_64
            os: ubuntu-latest
            method: bazel
            asset: libCLiteRTLM-linux-x86_64.so
          - name: windows-x86_64
            os: windows-latest
            method: bazel
            asset: CLiteRTLM-windows-x86_64.dll
          # macOS: Google already ships a universal (arm64+x86_64) dylib inside
          # the official xcframework, and building a shared lib from source hits
          # an upstream cxx/libc++ template error under our config. So just
          # repackage the official dylib — guaranteed correct, no Bazel.
          - name: macos-universal
            os: macos-14
            method: xcframework
            asset: CLiteRTLM-macos-universal.dylib
    steps:
      - name: Checkout LiteRT-LM
        if: matrix.method == 'bazel'
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ env.LITERT_LM_REF }}
          lfs: true
          submodules: recursive
          path: litert-lm

      - name: Setup Bazelisk
        if: matrix.method == 'bazel'
        uses: bazelbuild/setup-bazelisk@v3

      # Self-contained shared lib that exports the engine.h C ABI. Lives in its
      # own package so we don't touch upstream's c/BUILD load lines.
      # `//c:engine` is public + alwayslink.
      #
      # Two rules, one per platform leg:
      #   * linux -> cc_shared_library (proven): the GNU linker pulls every
      #     transitive static archive (incl. the Rust libs) into the .so.
      #   * windows -> cc_binary(linkshared): cc_shared_library DROPS the Rust
      #     static archives (tokenizers_*, llg_*, cxxbridge1 glue) from the MSVC
      #     link line -> 83 unresolved externals. A linkshared cc_binary links
      #     the FULL transitive static closure exactly like upstream's working
      #     litert_lm_main binary, so those archives are present. The C ABI is
      #     exported via __declspec(dllexport) (LITERT_LM_C_API_EXPORT).
      - name: Write shared-lib overlay
        if: matrix.method == 'bazel'
        shell: bash
        run: |
          mkdir -p litert-lm/litert_cshared
          cat > litert-lm/litert_cshared/BUILD.bazel <<'EOF'
          load("@rules_cc//cc:defs.bzl", "cc_binary", "cc_shared_library")

          cc_shared_library(
              name = "CLiteRTLM",
              roots = ["//c:engine"],
              visibility = ["//visibility:public"],
              user_link_flags = select({
                  "@platforms//os:linux": [
                      "-Wl,-soname,libCLiteRTLM.so",
                  ],
                  "//conditions:default": [],
              }),
          )

          cc_binary(
              name = "CLiteRTLM.dll",
              linkshared = True,
              deps = ["//c:engine"],
              visibility = ["//visibility:public"],
          )
          EOF
          echo "----- overlay BUILD.bazel -----"
          cat litert-lm/litert_cshared/BUILD.bazel

      - name: Build (linux)
        if: matrix.method == 'bazel' && runner.os == 'Linux'
        shell: bash
        working-directory: litert-lm
        run: |
          set -euo pipefail
          # http_archive fetches occasionally 502 from GitHub; retry the build
          # (Bazel resumes fetching, doesn't rebuild completed actions).
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed; retrying in 30s"; sleep 30; done; return 1; }
          retry bazel build //litert_cshared:CLiteRTLM
          cp "$(bazel cquery --output=files //litert_cshared:CLiteRTLM 2>/dev/null | head -n1)" "/tmp/${{ matrix.asset }}"
          ls -la "/tmp/${{ matrix.asset }}"

      - name: Build (windows)
        if: matrix.method == 'bazel' && runner.os == 'Windows'
        shell: bash
        working-directory: litert-lm
        env:
          # Git-bash/MSYS rewrites the leading `//` of a Bazel label into a
          # Windows path (`//litert_cshared:CLiteRTLM` -> `/litert_cshared:...`),
          # which Bazel rejects ("package names may not start with '/'").
          # Disable MSYS arg/path conversion so labels pass through verbatim.
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          # The runner ships an Android NDK and exports ANDROID_NDK_HOME etc.
          # litert-lm's WORKSPACE has android_ndk_repository auto-detect it, and
          # on Windows its symlink step writes outside the repo dir and aborts
          # analysis ("Cannot write outside of the repository directory").
          # We don't need the NDK for a host build; unset the vars so the repo
          # rule becomes a no-op empty repository.
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME ANDROID_HOME ANDROID_SDK_ROOT
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed; retrying in 30s"; sleep 30; done; return 1; }
          # Short output root to dodge MAX_PATH issues on Windows.
          retry bazel --output_user_root=C:/b build //litert_cshared:CLiteRTLM.dll --config=windows
          # cc_binary(linkshared) emits CLiteRTLM.dll plus an import library
          # (named CLiteRTLM.if.lib or CLiteRTLM.lib under bazel-bin).
          dll="$(bazel --output_user_root=C:/b cquery --config=windows --output=files //litert_cshared:CLiteRTLM.dll 2>/dev/null | grep -i '\.dll$' | head -n1)"
          cp "$dll" "/tmp/${{ matrix.asset }}"
          implib="$(find bazel-bin -iname 'CLiteRTLM*.lib' | head -n1)"
          cp "$implib" "/tmp/CLiteRTLM-windows-x86_64.lib"
          ls -la "/tmp/${{ matrix.asset }}" "/tmp/CLiteRTLM-windows-x86_64.lib"

      - name: Repackage official macOS xcframework
        if: matrix.method == 'xcframework'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/google-ai-edge/LiteRT-LM/releases/download/${LITERT_LM_REF}/CLiteRTLM_mac.xcframework.zip"
          echo "downloading $url"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/xcf.zip "$url"
          unzip -q -o /tmp/xcf.zip -d /tmp/xcf
          # Universal slice inside the xcframework; its install_name is already
          # @rpath/CLiteRTLM_mac.dylib (what build.rs expects).
          dylib="$(find /tmp/xcf -path '*macos-arm64_x86_64*/CLiteRTLM_mac.dylib' | head -n1)"
          test -n "$dylib"
          cp "$dylib" "/tmp/${{ matrix.asset }}"
          install_name_tool -id "@rpath/CLiteRTLM_mac.dylib" "/tmp/${{ matrix.asset }}" || true
          lipo -info "/tmp/${{ matrix.asset }}" || true
          ls -la "/tmp/${{ matrix.asset }}"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1" | awk '{print $1}'; else certutil -hashfile "$1" SHA256 | sed -n '2p' | tr -d '\r ' ; fi; }
          sha256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          if [ -f CLiteRTLM-windows-x86_64.lib ]; then
            sha256 CLiteRTLM-windows-x86_64.lib > CLiteRTLM-windows-x86_64.lib.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clitertlm-${{ matrix.name }}
          path: |
            /tmp/CLiteRTLM*.dylib
            /tmp/CLiteRTLM*.so
            /tmp/libCLiteRTLM*.so
            /tmp/CLiteRTLM*.dll
            /tmp/CLiteRTLM*.lib
            /tmp/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -la dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CLiteRTLM prebuilt (${{ env.LITERT_LM_REF }})
          body: |
            CLiteRTLM C shared libraries built from
            google-ai-edge/LiteRT-LM @ `${{ env.LITERT_LM_REF }}`.

            Consumed by `ellisii-llm-litert` build.rs when
            `LITERT_LM_PREBUILT=1` is set. Each `<asset>` ships with a
            matching `<asset>.sha256`.
          files: dist/*
          fail_on_unmatched_files: true
