[package]
name = "ellisii-jp-tokenizer-delarocha"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ellisii-jp-tokenizer-core.workspace = true
delarocha = { git = "https://github.com/bokuweb/delarocha", rev = "cae73d3", features = ["vibrato-system"], optional = true }

[features]
default = []
# Vibrato system dictionary (system.dic / system.dic.zst) を delarocha 経由でロードする。
real = ["dep:delarocha"]
